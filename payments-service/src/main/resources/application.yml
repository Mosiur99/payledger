spring:
  application:
    name: payments-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
