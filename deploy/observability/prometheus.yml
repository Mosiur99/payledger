global:
  scrape_interval: 5s

# The services run on the host during local development, so Prometheus reaches them through the Docker host gateway.
scrape_configs:
  - job_name: payments-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
