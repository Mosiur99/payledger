{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (not $svc.database.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-db
  labels:
    {{- include "payledger.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  username: {{ $svc.database.username | quote }}
  password: {{ $svc.database.password | quote }}
{{- end }}
{{- end }}
