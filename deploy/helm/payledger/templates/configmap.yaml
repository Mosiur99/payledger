{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "payledger.labels" (dict "root" $ "name" $name) | nindent 4 }}
data:
  PORT: {{ $svc.port | quote }}
  DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s" $.Values.postgres.host $.Values.postgres.port $svc.database.name | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ $.Values.kafka.bootstrapServers | quote }}
  TRACING_SAMPLING_PROBABILITY: {{ $.Values.tracing.samplingProbability | quote }}
  OTLP_TRACING_ENDPOINT: {{ $.Values.tracing.otlpEndpoint | quote }}
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  {{- if eq $name "payments-service" }}
  JWT_ISSUER_URI: {{ $.Values.jwt.issuerUri | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: {{ $.Values.jwt.jwkSetUri | quote }}
  {{- end }}
{{- end }}
{{- end }}
