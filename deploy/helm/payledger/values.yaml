image:
  registry: ghcr.io/mosiur99
  tag: latest
  pullPolicy: IfNotPresent

postgres:
  host: postgres
  port: 5432

kafka:
  bootstrapServers: kafka:9092

# Clients get tokens from the public Keycloak URL, so that is the issuer to expect;
# the signing keys are fetched over the cluster network.
jwt:
  issuerUri: http://localhost:8180/realms/payledger
  jwkSetUri: http://keycloak:8180/realms/payledger/protocol/openid-connect/certs

tracing:
  samplingProbability: "0.0"
  otlpEndpoint: http://jaeger:4318/v1/traces

services:
  payments-service:
    enabled: true
    replicas: 2
    port: 8080
    database:
      name: payments
      username: payments
      password: payments
      # Name of a Secret with "username" and "password" keys; the chart creates one when empty.
      existingSecret: ""
    service:
      type: ClusterIP
      nodePort: null
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 512Mi}

  notification-service:
    enabled: true
    replicas: 1
    port: 8081
    database:
      name: notifications
      username: notifications
      password: notifications
      existingSecret: ""
    service:
      type: ClusterIP
      nodePort: null
    resources:
      requests: {cpu: 100m, memory: 320Mi}
      limits: {memory: 448Mi}
